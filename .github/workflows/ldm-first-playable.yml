name: LDM first playable verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Runtime versions
        run: |
          node --version
          python --version
      - name: Native PNG measurement dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Native art reception
        run: python outils/recevoir_premier_jouable.py
      - name: Existing local game contracts
        run: |
          node modes/echos-de-la-greve/qa/teams.cjs
          node modes/echos-de-la-greve/qa/teams-independent.cjs
          node modes/echos-de-la-greve/qa/boss-compendium.cjs
          node modes/echos-de-la-greve/qa/original-entrypoints.cjs
      - name: Export measured metadata
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json
          files = ["modes/echos-de-la-greve/original-kits-assets.js", "modes/echos-de-la-greve/original-bosses-assets.js", "docs/combat/production/20261127-first-playable/assets-reception.json"]
          for name in files:
              path = Path(name)
              if not path.is_file():
                  continue
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode("ascii")
              print("FILEMETA|" + json.dumps({"path": name, "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "base64Length": len(encoded)}))
              for start in range(0, len(encoded), 4096):
                  print("FILEDATA|" + encoded[start:start+4096])
              print("FILEEND|" + name)
