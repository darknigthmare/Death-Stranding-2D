name: LDM first playable verification

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  native-art:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Native alpha measurement dependency
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Measure current original batch
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        shell: python
        run: |
          import os, urllib.request, json, runpy, sys
          from pathlib import Path
          base = "https://raw.githubusercontent.com/darknigthmare/Death-Stranding-2D/" + os.environ["SOURCE_SHA"] + "/"
          manifest_path = "docs/combat/production/20261127-first-playable/art-generation.json"
          def receive(name):
              path = Path(name)
              path.parent.mkdir(parents=True, exist_ok=True)
              with urllib.request.urlopen(base + name, timeout=60) as response:
                  path.write_bytes(response.read())
              return path
          manifest = json.loads(receive(manifest_path).read_text())
          for item in manifest["assets"]:
              receive(item["path"])
          script = receive("outils/recevoir_premier_jouable.py")
          sys.argv = [str(script), "--require-complete"]
          runpy.run_path(str(script), run_name="__main__")
  verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          fetch-depth: 0
      - name: Set runtime paths
        shell: python
        run: |
          import os
          with open(os.environ["GITHUB_ENV"], "a") as target:
              print("NODE_PATH=" + os.environ["RUNNER_TEMP"] + "/ldm-deps/node_modules", file=target)
              print("PLAYWRIGHT_BROWSERS_PATH=" + os.environ["RUNNER_TEMP"] + "/ldm-browsers", file=target)
              print("LDM_QA_OUTPUT=" + os.environ["GITHUB_WORKSPACE"] + "/docs/combat/production/20261127-first-playable", file=target)
      - name: Install bounded verification dependencies
        run: |
          node --version
          python --version
          python -m pip install --disable-pip-version-check Pillow==11.3.0
          npm install --prefix "$RUNNER_TEMP/ldm-deps" --no-audit --no-fund @napi-rs/canvas@0.1.80 playwright@1.58.0
          "$RUNNER_TEMP/ldm-deps/node_modules/.bin/playwright" install --with-deps chromium
      - name: Native art reception
        run: python outils/recevoir_premier_jouable.py --require-complete
      - name: Regenerate canonical reference catalogues
        if: always()
        run: |
          node outils/generer_catalogue_combat.cjs
          node outils/generer_catalogue_boss.cjs
      - name: Existing relay contracts
        if: always()
        run: |
          node modes/echos-de-la-greve/qa/teams.cjs --output="$LDM_QA_OUTPUT/teams-verification.json"
          node modes/echos-de-la-greve/qa/teams-independent.cjs --output="$LDM_QA_OUTPUT/teams-independent-verification.json"
      - name: Existing Boss behavior and compendium
        if: always()
        run: node modes/echos-de-la-greve/qa/boss-compendium.cjs "$LDM_QA_OUTPUT/boss-compendium-verification.json"
      - name: Balise mechanics and canonical regression
        if: always()
        run: node qa/original-kits.cjs > "$LDM_QA_OUTPUT/balise-verification.json"
      - name: Consignateur objectives and public victories
        if: always()
        run: node modes/echos-de-la-greve/qa/original-bosses.cjs > "$LDM_QA_OUTPUT/consignateur-verification.json"
      - name: First playable integration and delivery
        if: always()
        run: |
          node modes/echos-de-la-greve/qa/first-playable-entrypoints.cjs --output="$LDM_QA_OUTPUT/first-playable-entrypoints-verification.json"
          node modes/echos-de-la-greve/qa/first-playable-delivery.cjs
      - name: Native Canvas gameplay and pose reception
        if: always()
        run: node modes/echos-de-la-greve/qa/first-playable-canvas.cjs
      - name: Actual Chromium first playable flows
        if: always()
        run: node modes/echos-de-la-greve/qa/first-playable-browser.cjs
      - name: Presentation and exercises
        if: always()
        run: |
          node modes/echos-de-la-greve/qa/presentation.cjs --output="$LDM_QA_OUTPUT/presentation-verification.json"
          node modes/echos-de-la-greve/qa/lessons.cjs --output="$LDM_QA_OUTPUT/lessons-verification.json"
          node modes/echos-de-la-greve/qa/original-entrypoints.cjs
      - name: Actual Chromium catalogue and relay
        if: always()
        run: node modes/echos-de-la-greve/qa/original-browser.cjs
      - name: Export reviewable metadata and captures
        if: always()
        shell: python
        run: |
          from pathlib import Path
          import base64, hashlib, json
          root = Path("docs/combat/production/20261127-first-playable")
          files = [Path(name) for name in [
              "modes/echos-de-la-greve/original-kits-assets.js",
              "modes/echos-de-la-greve/original-bosses-assets.js",
              "modes/echos-de-la-greve/moves-data.js",
              "modes/echos-de-la-greve/boss-data.js",
              "docs/combat/data/actions-et-ia.json",
              "docs/combat/ACTIONS_ET_IA.md",
              "docs/combat/data/boss-et-rencontres.json",
              "docs/combat/BOSS_ET_RENCONTRES.md"]]
          files.extend(path for path in root.rglob("*") if path.is_file() and path.suffix in (".json", ".webp", ".png") and not path.name.endswith("art-generation.json"))
          for path in files:
              if not path.is_file():
                  continue
              data = path.read_bytes()
              encoded = base64.b64encode(data).decode("ascii")
              print("FILEMETA|" + json.dumps({"path": str(path), "bytes": len(data), "sha256": hashlib.sha256(data).hexdigest(), "base64Length": len(encoded)}))
              for start in range(0, len(encoded), 4096):
                  print("FILEDATA|" + encoded[start:start+4096])
              print("FILEEND|" + str(path))
